<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Study Planner{% endblock %}</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dark-theme">
    {% if session.get('user_id') %}
    <!-- Sidebar Navigation -->
    <nav class="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <i class="fas fa-graduation-cap"></i>
                <span>StudyPlanner</span>
            </div>
            <p class="tagline">Plan. Study. Achieve.</p>
        </div>

        <ul class="nav-menu">
            <li class="nav-item {% if request.endpoint == 'dashboard' %}active{% endif %}">
                <a href="{{ url_for('dashboard') }}">
                    <i class="fas fa-th-large"></i>
                    <span>Dashboard</span>
                </a>
            </li>
            <li class="nav-item {% if request.endpoint == 'tasks' %}active{% endif %}">
                <a href="{{ url_for('tasks') }}">
                    <i class="fas fa-tasks"></i>
                    <span>Tasks</span>
                </a>
            </li>
            <li class="nav-item {% if request.endpoint == 'calendar' %}active{% endif %}">
                <a href="{{ url_for('calendar') }}">
                    <i class="fas fa-calendar-alt"></i>
                    <span>Calendar</span>
                </a>
            </li>
            <li class="nav-item {% if request.endpoint == 'statistics' %}active{% endif %}">
                <a href="{{ url_for('statistics') }}">
                    <i class="fas fa-chart-bar"></i>
                    <span>Statistics</span>
                </a>
            </li>
            <li class="nav-item {% if request.endpoint in ['notes', 'new_note', 'edit_note'] %}active{% endif %}">
                <a href="{{ url_for('notes') }}">
                    <i class="fas fa-sticky-note"></i>
                    <span>Notes</span>
                </a>
            </li>
            <li class="nav-item {% if request.endpoint == 'settings' %}active{% endif %}">
                <a href="{{ url_for('settings') }}">
                    <i class="fas fa-cog"></i>
                    <span>Settings</span>
                </a>
            </li>
        </ul>

        <div class="sidebar-footer">
            <a href="{{ url_for('logout') }}" class="logout-btn">
                <i class="fas fa-sign-out-alt"></i>
                <span>Logout</span>
            </a>
        </div>
    </nav>

    <!-- Mobile Header -->
    <header class="mobile-header">
        <button class="menu-toggle" onclick="toggleSidebar()">
            <i class="fas fa-bars"></i>
        </button>
        <div class="mobile-logo">
            <i class="fas fa-graduation-cap"></i>
            <span>StudyPlanner</span>
        </div>
        <div class="mobile-profile">
            <i class="fas fa-user-circle"></i>
        </div>
    </header>
    {% endif %}

    <!-- Main Content -->
    <main class="main-content {% if not session.get('user_id') %}full-width{% endif %}">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
