{% extends "base.html" %}

{% block title %}Edit Note - Study Planner{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Edit Note</h1>
    <p>Update your note</p>
</div>

<div class="form-container">
    {% if error %}
    <div class="error-message" style="margin-bottom: 20px;">
        <i class="fas fa-exclamation-circle"></i> {{ error }}
    </div>
    {% endif %}

<form method="POST" action="{{ url_for('edit_note', note_id=note.id) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label class="form-label">Title</label>
            <input type="text" name="title" class="form-input" placeholder="Note title" value="{{ note.title }}" required>
        </div>

        <div class="form-group">
            <label class="form-label">Content</label>
            <textarea name="content" class="form-textarea" style="min-height: 300px;" placeholder="Write your note here...">{{ note.content }}</textarea>
        </div>

        <div style="display: flex; gap: 12px;">
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save"></i> Save Changes
            </button>
            <a href="{{ url_for('notes') }}" class="btn" style="background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-secondary);">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
